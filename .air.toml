root = "."
tmp_dir = "tmp"
[build]
cmd = "go build -o ./tmp/hadalbot ./cmd/hadalbot"
bin = "./tmp/hadalbot"
args_bin = ["-config", "configs/development.yaml"]
include_ext = ["go", "yaml", "sql", "html", "css"]
exclude_dir = ["tmp", "bin", ".git", ".tools", "docs"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "3s"
[build.windows]
cmd = "go build -o ./tmp/hadalbot.exe ./cmd/hadalbot"
bin = "./tmp/hadalbot.exe"
[log]
time = true
[misc]
clean_on_exit = true
